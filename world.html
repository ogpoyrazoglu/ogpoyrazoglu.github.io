<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Walk through OGP’s 3D robotics lab and explore selected publications, the BlueBoat, Skydio F10, F1TENTH racer, and AlphaTruck.">
  <meta name="theme-color" content="#cfdad4">
  <meta property="og:title" content="Robotics lab · OGP">
  <meta property="og:description" content="Explore a 3D robotics lab with a research whiteboard and four robot exhibits.">
  <link rel="canonical" href="https://ogpoyrazoglu.github.io/world.html">
  <link rel="icon" href="assets/ogp.svg" type="image/svg+xml">
  <link rel="stylesheet" href="world.css">
  <script src="world.js" type="module"></script>
  <title>Robotics lab · OGP</title>
</head>
<body class="world">
  <a class="skip" href="#map">Skip to the lab</a>
  <main class="lab" id="main">
    <h1 class="visually-hidden">OGP’s robotics lab</h1>
    <div class="map-frame">
      <canvas id="map" tabindex="0" aria-label="3D robotics lab" aria-describedby="map-help"></canvas>
      <div id="map-markers"></div>
      <p id="scene-status" role="status">Loading the robotics lab…</p>
      <noscript><p class="no-script">Enable JavaScript to walk around the lab, or visit the <a href="classic.html">classic site</a>.</p></noscript>
    </div>

    <header class="hud hud-top">
      <a class="brand" href="./" aria-label="OGP home"><img src="assets/ogp-mark.svg" width="64" height="34" alt=""></a>
      <p class="location"><span class="status-light" aria-hidden="true"></span><span id="map-location">Lab entrance</span></p>
      <nav class="hud-actions" aria-label="Lab controls">
        <button id="camera" type="button" aria-pressed="false" disabled>Follow camera</button>
        <button id="reset" type="button" disabled>Reset</button>
        <a href="classic.html">Classic site</a>
      </nav>
    </header>

    <aside class="exhibit" aria-labelledby="exhibit-title" hidden>
      <div class="exhibit-body" aria-live="polite">
        <p class="exhibit-type" id="exhibit-type">Lab tour</p>
        <h2 id="exhibit-title">Lab entrance</h2>
        <p id="exhibit-copy"></p>
        <section id="paper-viewer" aria-label="Whiteboard publications" hidden>
          <button id="paper-prev" type="button" aria-label="Previous paper" aria-keyshortcuts="ArrowLeft"><kbd aria-hidden="true">←</kbd> Previous</button>
          <p id="paper-position" aria-live="polite"></p>
          <button id="paper-next" type="button" aria-label="Next paper" aria-keyshortcuts="ArrowRight">Next <kbd aria-hidden="true">→</kbd></button>
          <a id="paper-detail" href="classic.html#research">Open paper <span aria-hidden="true">↗</span></a>
        </section>
        <div class="exhibit-actions">
          <button id="inspect-exhibit" type="button" aria-pressed="false" aria-keyshortcuts="E" hidden><span class="label">Close-up view</span> <kbd aria-hidden="true">E</kbd></button>
          <a id="exhibit-link" href="classic.html#research">See my research <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </aside>

    <div class="hud hud-bottom">
      <p id="map-help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys to walk. Click a number to visit an exhibit.</p>
      <div class="dpad" aria-label="Move the character" role="group">
        <button type="button" data-direction="up" aria-label="Walk up" disabled>↑</button>
        <button type="button" data-direction="left" aria-label="Walk left" disabled>←</button>
        <button type="button" data-direction="down" aria-label="Walk down" disabled>↓</button>
        <button type="button" data-direction="right" aria-label="Walk right" disabled>→</button>
      </div>
    </div>
  </main>
</body>
</html>
